name: Descargar documentos de prensa
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/prensa/fuentes.tsv'
      - 'docs/prensa/descargar.sh'
      - '.github/workflows/descargar-documentos.yml'
permissions:
  contents: write
jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash docs/prensa/descargar.sh
      - name: Guardar en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/prensa
          git diff --cached --quiet || git commit -m "docs: copia de documentos de prensa y premios"
          git push
